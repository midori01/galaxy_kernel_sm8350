name: Build and Release
run-name: "${{ github.event.inputs.ksu_source }} - ${{ github.event.inputs.compiler }}"
on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release Title"
        required: true
        default: "Kernel - 5.4"
      ksu_source:
        description: "KernelSU Source"
        type: choice
        required: true
        default: "backslashxx/KernelSU:master"
        options:
          - "backslashxx/KernelSU:master"
          - "backslashxx/KernelSU:staging"
          - "midori01/KernelSU:xx"
      hook_mode:
        description: "Hook Mode"
        type: choice
        required: true
        default: "Syscall Table Tamper"
        options:
          - Manual
          - Hybrid
          - Syscall Table Tamper
          - Branch with Link Hijack
      build_timestamp:
        description: "Build Timestamp (leave empty for current UTC)"
        required: false
        default: ""
      compiler:
        description: "Compiler"
        type: choice
        required: true
        default: "gcc"
        options:
          - gcc
          - "clang 23 (r614150)"
          - "clang 19 (r530567)"
      ksu_manager:
        description: "Manager"
        type: choice
        required: true
        default: "MidoriSU"
        options:
          - MidoriSU
          - KernelSU
      droidspaces:
        description: "Enable Droidspaces"
        type: boolean
        required: true
        default: true
      enable_susfs:
        description: "Enable SUSFS"
        type: boolean
        required: true
        default: true
      use_ccache:
        description: "Ccache Speedup"
        type: boolean
        required: true
        default: true
      ksu_debug:
        description: "KernelSU Debug"
        type: boolean
        required: true
        default: false
      cleanup_tags:
        description: "Cleanup Old Releases"
        type: boolean
        required: true
        default: true

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LOCALVERSION: -susfs-droidspaces
      KBUILD_BUILD_USER: midori
      KBUILD_BUILD_HOST: build-host
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup build environment and ccache
        run: |
          sudo apt update && sudo apt install -yq ccache clang golang build-essential lld gcc-aarch64-linux-gnu zip unzip curl git zstd
          if [ "${{ github.event.inputs.use_ccache }}" = "true" ]; then
            mkdir -p ${{ github.workspace }}/.ccache
            ccache -M 10G -z
            echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
            echo "USE_CCACHE=1" >> $GITHUB_ENV
            echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
            echo "CCACHE_SLOPPINESS=file_macro,include_file_mtime,time_macros" >> $GITHUB_ENV
          else
            echo "USE_CCACHE=0" >> $GITHUB_ENV
          fi
          BUILD_TIME="${{ github.event.inputs.build_timestamp }}"
          echo "KBUILD_BUILD_TIMESTAMP=${BUILD_TIME:-$(date -u +'%a %b %d %H:%M:%S UTC %Y')}" >> $GITHUB_ENV
          echo "GCC_VER=$(aarch64-linux-gnu-gcc --version | head -n1 | awk '{print $NF}')" >> $GITHUB_ENV

      - name: Restore Ccache
        if: github.event.inputs.use_ccache == 'true'
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.event.inputs.compiler }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.event.inputs.compiler }}-

      - name: Fetch Clang
        if: startsWith(github.event.inputs.compiler, 'clang')
        run: |
          if [ ! -f "clang/bin/clang" ]; then
            CLANG_URL="${{ startsWith(github.event.inputs.compiler, 'clang 23') && format('https://github.com/{0}/releases/download/toolchain/clang-r614150.tar.gz', github.repository) || format('https://github.com/{0}/releases/download/toolchain/clang-r530567.tar.gz', github.repository) }}"
            mkdir -p clang && curl -sSfL "$CLANG_URL" | tar -xz -C clang
          fi
          echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH
          echo "CLANG_VER=$(clang/bin/clang --version | head -n1 | sed -E 's/.*based on (r[0-9]+).*[Cc]lang version ([0-9.]+).*/Clang \2 (\1)/; s/.*[Cc]lang version ([^ ]+).*/Clang \1/')" >> $GITHUB_ENV

      - name: Setup KernelSU
        id: ksu_setup
        run: |
          IFS=':' read -r KSU_REPO KSU_BRANCH <<< "${{ github.event.inputs.ksu_source }}"
          curl -LSs "https://raw.githubusercontent.com/${KSU_REPO}/${KSU_BRANCH}/kernel/setup.sh" | bash -s ${KSU_BRANCH}
          patch -p1 -d KernelSU < <(curl -sSfL "https://github.com/midori01/KernelSU/commit/xx~1.patch")
          echo "CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y" >> arch/arm64/configs/o1q_defconfig
          ${{ github.event.inputs.ksu_debug == 'true' && 'echo "CONFIG_KSU_DEBUG=y" >> arch/arm64/configs/o1q_defconfig' || '' }}
          cd KernelSU
          echo "ksu_repo=${KSU_REPO}" >> $GITHUB_OUTPUT
          echo "ksu_branch=${KSU_BRANCH}" >> $GITHUB_OUTPUT
          echo "ksu_commit=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          echo "ksu_full_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "ksu_date=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S %z' | sed 's/\([+-][0-9]\{2\}\)\([0-9]\{2\}\)/\1:\2/')" >> $GITHUB_OUTPUT

      - name: Apply Midori Customization
        if: github.event.inputs.ksu_manager == 'MidoriSU'
        run: |
          echo "[+] Starting Midori customization..."
          echo "[+] Fetching commit count from MidoriSU repository..."
          COMMIT_COUNT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/midori01/KernelSU/commits?per_page=1" -I 2>&1 | grep "link:" | grep -oP '&page=\K\d+(?=>; rel="last")')
          COMMIT_COUNT=${COMMIT_COUNT:-0}
          echo "[✓] Commit count retrieved: $COMMIT_COUNT"
          NEW_KSU_VERSION=$((30999 + ${COMMIT_COUNT}))
          echo "[+] Calculated KSU_VERSION: $NEW_KSU_VERSION"
          echo "[+] Updating KSU_VERSION in Makefile..."
          sed -i "s/-DKSU_VERSION=[0-9]*/-DKSU_VERSION=$NEW_KSU_VERSION/g" KernelSU/kernel/Makefile
          echo "[✓] KSU_VERSION updated to $NEW_KSU_VERSION in Makefile"
          echo "[+] Patching APK signature verification..."
          sed -i 's/\(unsigned char buffer\[0x1[01]\] = { 0 };\)/return true;\n\t\1/g' KernelSU/kernel/manager/apk_sign.c
          echo "[✓] Added early return true to bypass signature check"
          echo "[+] Replacing is_manager_apk function..."
          sed -i '/bool is_manager_apk(char \*path)/,$d' KernelSU/kernel/manager/apk_sign.c
          echo -e 'bool is_manager_apk(char *path)\n{\n\tchar pkg[KSU_MAX_PACKAGE_NAME];\n\tif (get_pkg_from_apk_path(pkg, path) < 0) {\n\t\treturn false;\n\t}\n\treturn strcmp(pkg, "com.midori.supermanager") == 0 ||\n\t       strcmp(pkg, "com.midori.su.manager") == 0;\n}' >> KernelSU/kernel/manager/apk_sign.c
          echo "[✓] is_manager_apk function replaced with MidoriSU package check"
          echo "[✓] Midori customization completed successfully!"
          echo "[+] Summary:"
          echo "    - KSU_VERSION: $NEW_KSU_VERSION"
          echo "    - Manager packages: com.midori.supermanager, com.midori.su.manager"
          echo "    - Signature verification: bypassed"

      - name: Configure Hook Mode
        run: |
          echo "[+] Configuring Hook Mode..."
          case "${{ github.event.inputs.hook_mode }}" in
            Manual)
              echo "# CONFIG_KPROBES is not set" >> arch/arm64/configs/o1q_defconfig
              echo "# CONFIG_KSU_KPROBES_KSUD is not set" >> arch/arm64/configs/o1q_defconfig ;;
            Hybrid)
              echo "CONFIG_KPROBES=y" >> arch/arm64/configs/o1q_defconfig
              echo "CONFIG_KSU_KPROBES_KSUD=y" >> arch/arm64/configs/o1q_defconfig ;;
            "Syscall Table Tamper")
              echo "# CONFIG_KPROBES is not set" >> arch/arm64/configs/o1q_defconfig
              echo "# CONFIG_KSU_KPROBES_KSUD is not set" >> arch/arm64/configs/o1q_defconfig
              echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" >> arch/arm64/configs/o1q_defconfig ;;
            "Branch with Link Hijack")
              echo "CONFIG_KPROBES=y" >> arch/arm64/configs/o1q_defconfig
              echo "CONFIG_KSU_KPROBES_KSUD=y" >> arch/arm64/configs/o1q_defconfig
              echo "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" >> arch/arm64/configs/o1q_defconfig ;;
          esac
          echo "[✓] Hook Mode configuration completed successfully!"

      - name: Setup SUSFS
        if: github.event.inputs.enable_susfs == 'true'
        run: |
          echo "[+] Applying SUSFS patches..."
          patch -p1 -d KernelSU < <(curl -sL "https://github.com/midori01/KernelSU/commit/xx.patch")
          echo "[✓] SUSFS patches applied successfully!"

      - name: Setup Droidspaces
        if: github.event.inputs.droidspaces == 'true'
        run: |
          echo "CONFIG_SYSVIPC=y" >> arch/arm64/configs/o1q_defconfig
          echo "CONFIG_POSIX_MQUEUE=y" >> arch/arm64/configs/o1q_defconfig
          echo "CONFIG_IPC_NS=y" >> arch/arm64/configs/o1q_defconfig
          echo "CONFIG_PID_NS=y" >> arch/arm64/configs/o1q_defconfig
          echo "CONFIG_DEVTMPFS=y" >> arch/arm64/configs/o1q_defconfig
          echo "[✓] Droidspaces configuration completed successfully!"

      - name: Build Kernel (Clang)
        if: startsWith(github.event.inputs.compiler, 'clang')
        run: |
          sed -i '/-fno-strict-overflow/a KBUILD_CFLAGS\t+= $(call cc-option,-fwrapv-pointer)\nKBUILD_CFLAGS\t+= $(call cc-option,-fno-pointer-tbaa)' Makefile
          CC="${{ github.event.inputs.use_ccache == 'true' && 'ccache clang' || 'clang' }}"
          MAKE_ARGS=(-j$(nproc) -C $(pwd) O=$(pwd)/out ARCH=arm64 CC="$CC" CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w")
          make "${MAKE_ARGS[@]}" o1q_defconfig
          make "${MAKE_ARGS[@]}"
          make "${MAKE_ARGS[@]}" INSTALL_MOD_PATH=modules INSTALL_MOD_STRIP=1 modules_install
          ${{ github.event.inputs.use_ccache == 'true' && 'ccache -s' || '' }}

      - name: Build Kernel (GCC)
        if: github.event.inputs.compiler == 'gcc'
        run: |
          ${{ github.event.inputs.use_ccache == 'true' && 'mkdir -p ccache-bin && ln -sf "$(which ccache)" ccache-bin/aarch64-linux-gnu-gcc && export PATH="$(pwd)/ccache-bin:$PATH"' || '' }}
          sed -i 's/-Wno-frame-larger-than=\?[^ ]*//g' drivers/optics/Makefile
          echo 'CFLAGS_REMOVE_tsl2510.o += -mgeneral-regs-only' >> drivers/optics/Makefile
          MAKE_ARGS=(-j$(nproc) -C $(pwd) O=$(pwd)/out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-w")
          make "${MAKE_ARGS[@]}" o1q_defconfig
          make "${MAKE_ARGS[@]}"
          make "${MAKE_ARGS[@]}" INSTALL_MOD_PATH=modules INSTALL_MOD_STRIP=1 modules_install
          ${{ github.event.inputs.use_ccache == 'true' && 'ccache -s' || '' }}

      - name: Export Debug Symbols
        if: github.event.inputs.ksu_debug == 'true'
        working-directory: out
        run: |
          if [ -f "vmlinux" ]; then
            zstd -T0 -10 vmlinux -o vmlinux.zst
          else
            echo "::warning::vmlinux not found in out directory"
            exit 1
          fi
          if [ -f "System.map" ]; then
            zstd -T0 -10 System.map -o System.map.zst
          else
            echo "::warning::System.map not found in out directory"
          fi

      - name: Upload Debug Symbols Artifact
        if: github.event.inputs.ksu_debug == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ksu-debug-${{ steps.ksu_setup.outputs.ksu_commit }}
          path: |
            out/vmlinux.zst
            out/System.map.zst
          retention-days: 7

      - name: Package AnyKernel3
        run: |
          git clone -q https://github.com/midori01/AnyKernel3 -b qgki --depth 1 AnyKernel3
          mkdir -p AnyKernel3/modules/vendor/lib/modules/
          find out/modules -type f -iname "*.ko" -exec cp -r {} AnyKernel3/modules/vendor/lib/modules/ \;
          cp out/arch/arm64/boot/Image out/arch/arm64/boot/dtbo.img AnyKernel3/
          KERNEL_VER=$(grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile | awk '{print $3}' | paste -sd.)
          cd AnyKernel3 && zip -r9 -q ../Kernel-${KERNEL_VER}_$(TZ='Asia/Tokyo' date +%Y%m%d-%H%M).zip . -x '*.git*' '*patch*' '*ramdisk*' 'LICENSE' 'README.md'

      - name: Save Ccache
        if: github.event.inputs.use_ccache == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kernel
          path: ./*.zip

      - name: Generate Release Body
        id: release_body
        run: |
          cat > release_body.md << EOF
          ## 📦 Build Information
          - 🕐 **Build Date**: \`$(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M:%S +09:00')\`
          - 🔧 **Compiler**: \`${{ startsWith(github.event.inputs.compiler, 'clang') && env.CLANG_VER || format('GCC ({0})', env.GCC_VER) }}\`
          - 📌 **KSU Source**: [\`${{ github.event.inputs.ksu_source }}\`](https://github.com/${{ steps.ksu_setup.outputs.ksu_repo }}/tree/${{ steps.ksu_setup.outputs.ksu_branch }})
          - 🔖 **Commit**: [\`${{ steps.ksu_setup.outputs.ksu_commit }}\`](https://github.com/${{ steps.ksu_setup.outputs.ksu_repo }}/commit/${{ steps.ksu_setup.outputs.ksu_full_commit }}) \`${{ steps.ksu_setup.outputs.ksu_date }}\`
          - ⚙️ **Hook Mode**: \`${{ github.event.inputs.hook_mode }}\`
          - 📱 **Manager**: \`${{ github.event.inputs.ksu_manager }}\`
          - 🛡️ **Droidspaces**: \`${{ github.event.inputs.droidspaces == 'true' && 'Enabled' || 'Disabled' }}\`
          - 🔮 **SUSFS**: \`${{ github.event.inputs.enable_susfs == 'true' && 'Enabled' || 'Disabled' }}\`
          - 🚀 **Ccache Speedup**: \`${{ github.event.inputs.use_ccache == 'true' && 'Enabled' || 'Disabled' }}\`
          - 🐛 **KernelSU Debug**: \`${{ github.event.inputs.ksu_debug == 'true' && 'Enabled' || 'Disabled' }}\`
          EOF
          echo "body_path=release_body.md" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: ./*.zip
          name: ${{ github.event.inputs.release_name }}
          tag_name: CI_${{ github.run_id }}
          body_path: ${{ steps.release_body.outputs.body_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    needs: build_kernel
    if: github.event.inputs.cleanup_tags == 'true'
    uses: ./.github/workflows/cleanup-tags.yml
